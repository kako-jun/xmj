<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>邪雀 Xtreme Mahjong - xmj</title>
    <style>
      /*
       * 麻雀牌 (U+1F000–U+1F02B) を mono glyph で固定描画するため、
       * Noto Sans Symbols 2 の mahjong 範囲だけを subset した 12KB の
       * woff2 を自前ホストする。これで OS 標準の絵文字フォント (Apple
       * Color Emoji 等) に乗っ取られず、`fill` 色 (萬子ダークレッド・赤ドラ等)
       * がそのまま反映される。
       */
      @font-face {
        font-family: "XmjMahjong";
        src: url("/fonts/noto-sans-symbols2-mahjong.woff2") format("woff2");
        font-display: block;
        unicode-range: U+1F000-1F02B;
      }
      :root {
        --bg-deep: #0a0a0a;
        --bg-panel: #14140f;
        --border-accent: #b39a6e;
        --border-muted: #7a6038;
        --text-primary: #ece2c4;
        --text-muted: #a89c80;
        --text-danger: #b84a4a;
        --turn-glow: #e8c47a;
        --action-fill: #2a1d0d;
        --action-fill-disabled: #242422;
        --side-width: clamp(280px, 28vw, 360px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg-deep);
        color: var(--text-primary);
        font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
        overflow: hidden;
        height: 100%;
        -webkit-font-smoothing: antialiased;
      }
      /*
       * レイアウト振り分け: 縦長スマホは卓→操作系の縦積み、横長 PC は卓→操作系の横並び。
       * CSS Grid のテンプレートだけで切り替えるので JS の resize 監視は不要。
       */
      #app {
        display: grid;
        width: 100vw;
        height: 100vh;
        gap: 0;
        background: var(--bg-deep);
      }
      @media (orientation: portrait), (max-aspect-ratio: 1 / 1) {
        #app {
          grid-template-rows: 1fr auto;
          grid-template-columns: 100vw;
          grid-template-areas:
            "table"
            "side";
        }
        #ui-side {
          max-height: 45vh;
        }
      }
      @media (orientation: landscape) and (min-aspect-ratio: 1 / 1) {
        #app {
          grid-template-columns: 1fr var(--side-width);
          grid-template-rows: 100vh;
          grid-template-areas: "table side";
        }
      }
      #ui-table {
        grid-area: table;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        overflow: hidden;
        position: relative;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
      }
      #ui-side {
        grid-area: side;
        display: flex;
        flex-direction: column;
        background: var(--bg-panel);
        border-left: 1px solid rgba(179, 154, 110, 0.18);
        overflow: hidden;
        min-height: 0;
      }
      @media (orientation: portrait), (max-aspect-ratio: 1 / 1) {
        #ui-side {
          border-left: none;
          border-top: 1px solid rgba(179, 154, 110, 0.18);
        }
      }
      .side-section {
        padding: 8px 12px;
        border-bottom: 1px solid rgba(179, 154, 110, 0.12);
      }
      .side-section:last-child {
        border-bottom: none;
      }
      .side-section h2 {
        font-size: 11px;
        font-weight: 700;
        margin: 0 0 4px 0;
        color: var(--text-muted);
        letter-spacing: 0.08em;
      }
      #ui-status {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      #ui-status .round {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
      }
      #ui-status .honba,
      #ui-status .oya,
      #ui-status .wall {
        font-size: 13px;
        color: var(--text-muted);
      }
      #ui-status .oya {
        color: var(--turn-glow);
      }
      #ui-status .dora-row {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-left: auto;
      }
      #ui-status .dora-label {
        font-size: 11px;
        color: var(--text-muted);
      }
      #ui-status .dora-tile {
        /* #96 余白 0 化: tile bbox 比 (40:56 = 1:1.4) を inline-block で固定し、
           font-size = height、letter-spacing = 0 で glyph が枠いっぱい出る。
           自前ホスト XmjMahjong (U+1F000-1F02B subset) のみ使用、OS 絵文字優先を排除。 */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 28px;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0;
        padding: 0;
        background: #ffffff;
        color: #1a1a1a;
        border-radius: 3px;
        overflow: hidden;
        font-family: "XmjMahjong";
      }
      #ui-scores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
      }
      /*
       * 席色 (風固定): 東=赤 / 南=黄 / 西=青 / 北=緑。
       * 値は web/src/game/seatColors.ts の SEAT_COLORS と一致させること。
       * row 全体に風色の背景を当て、文字色は背景輝度から黒/白を選んだ値で固定する。
       * これにより「水色 (西) 背景に白文字、黄色 (南) 背景に白文字」のような可読性
       * 揺れを根絶する (旧仕様では文字色がデフォルト color から継承され、不整合だった)。
       * data-self は人間プレイヤーの行マーカーとしてだけ残し、左黄色ラインなどの
       * 装飾は当てない (色は風で決まる、自分用の追加色は重ねない)。
       */
      .score-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
      }
      .score-row[data-wind='east'] {
        background: #d65a4a;
        color: #1a1a1a;
      }
      .score-row[data-wind='south'] {
        background: #e8c94a;
        color: #1a1a1a;
      }
      .score-row[data-wind='west'] {
        background: #3a7ab8;
        color: #ffffff;
      }
      .score-row[data-wind='north'] {
        background: #3f9a5b;
        color: #ffffff;
      }
      .score-row.is-turn {
        outline: 2px solid var(--turn-glow);
        outline-offset: -2px;
        font-weight: 700;
      }
      .score-row .wind {
        font-size: 14px;
        font-weight: 700;
        min-width: 1.2em;
        color: inherit;
      }
      .score-row .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: inherit;
      }
      .score-row .points {
        font-weight: 700;
        color: inherit;
      }
      .score-row.is-bankrupt .points {
        /* 破産は風色を残しつつ、点数だけ目立たせる: 文字をやや透過させない太字 */
        text-decoration: underline wavy;
      }
      .score-row .riichi {
        font-size: 11px;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.25);
        color: inherit;
      }
      /* 操作ブロックは右下に固定。ボタン数が増えても領域は広がらず、
       * grid auto-fill で均等分割されるので 1 ボタンあたりが小さくなる。 */
      #ui-actions-section {
        background: rgba(0, 0, 0, 0.25);
      }
      /* 1 行に全部のアクションを並べ、ボタンが増えるほど 1 個あたりが横に細くなる */
      #ui-actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 4px;
        height: 56px;
      }
      .action-btn {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        padding: 4px 6px;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        background: var(--action-fill);
        border: 2px solid var(--border-accent);
        border-radius: 10px;
        cursor: pointer;
        transition: filter 0.1s;
      }
      .action-btn:hover {
        filter: brightness(1.18);
      }
      .action-btn:active {
        filter: brightness(0.85);
      }
      .action-btn[disabled] {
        color: var(--text-muted);
        background: var(--action-fill-disabled);
        border-color: var(--text-muted);
        opacity: 0.55;
        cursor: not-allowed;
      }
      .action-btn .hotkey {
        display: inline-block;
        font-size: 10px;
        color: var(--text-muted);
        margin-left: 4px;
        font-weight: 400;
      }
      #ui-log {
        flex: 1;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-primary);
        min-height: 80px;
        font-family: "JetBrains Mono", "Menlo", monospace;
      }
      #ui-log .log-entry {
        padding: 4px 6px;
        margin: 2px 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
        border-left: 3px solid transparent;
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      #ui-log .log-entry .log-tag {
        font-size: 10px;
        font-weight: bold;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
        line-height: 1.4;
      }
      #ui-log .log-entry .log-body {
        flex: 1;
        word-break: break-word;
      }
      /*
       * 実況ログ chat の話者タグ色は SEAT_COLORS と完全一致させる。
       * 旧 spk-self (#ffd75f 黄) は南家 (#e8c94a 黄) と衝突したため廃止し、
       * 人間プレイヤーは自分の風 (= 起家時は南風) に応じた spk-east 等を htmlUi
       * 側で当てる。
       */
      #ui-log .log-entry.spk-east .log-tag {
        color: #1a1a1a;
        background: #d65a4a;
      }
      #ui-log .log-entry.spk-east {
        border-left-color: #d65a4a;
      }
      #ui-log .log-entry.spk-south .log-tag {
        color: #1a1a1a;
        background: #e8c94a;
      }
      #ui-log .log-entry.spk-south {
        border-left-color: #e8c94a;
      }
      #ui-log .log-entry.spk-west .log-tag {
        color: #ffffff;
        background: #3a7ab8;
      }
      #ui-log .log-entry.spk-west {
        border-left-color: #3a7ab8;
      }
      #ui-log .log-entry.spk-north .log-tag {
        color: #ffffff;
        background: #3f9a5b;
      }
      #ui-log .log-entry.spk-north {
        border-left-color: #3f9a5b;
      }
      #ui-log .log-entry.log-system {
        color: var(--text-muted);
        font-style: italic;
        border-left-color: rgba(255, 255, 255, 0.2);
      }
      #ui-log .log-entry:last-child {
        background: rgba(255, 215, 95, 0.1);
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #14140f;
        color: #fff;
        z-index: 10;
      }
      #loading-bar {
        width: 60%;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin-top: 12px;
        overflow: hidden;
      }
      #loading-bar > div {
        height: 100%;
        width: 0%;
        background: #fff;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div>Loading…</div>
      <div id="loading-bar"><div></div></div>
    </div>

    <div id="app">
      <div id="ui-table">
        <div id="game"></div>
      </div>
      <aside id="ui-side" aria-label="操作パネル">
        <section class="side-section">
          <div id="ui-status">
            <span class="round" data-ui="round">—</span>
            <span class="honba" data-ui="honba"></span>
            <span class="oya" data-ui="oya"></span>
            <span class="wall" data-ui="wall"></span>
            <span class="dora-row">
              <span class="dora-label">ドラ</span>
              <span data-ui="dora"></span>
            </span>
          </div>
        </section>
        <section class="side-section">
          <h2>点数</h2>
          <div id="ui-scores" data-ui="scores"></div>
        </section>
        <section class="side-section" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
          <h2>実況</h2>
          <div id="ui-log" data-ui="log"></div>
        </section>
        <section class="side-section" id="ui-actions-section">
          <h2>操作</h2>
          <div id="ui-actions" data-ui="actions"></div>
        </section>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
