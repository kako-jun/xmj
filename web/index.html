<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>邪雀 Xtreme Mahjong - xmj</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      canvas {
        display: block;
        /* PixiJS の内部解像度は 1280x720。アスペクト比 16:9 を維持したまま
           ビューポートに収める。max-width/max-height だけだと縦横独立に
           縮められて牌や文字が歪むので width/height を式で固定する。 */
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        aspect-ratio: 16 / 9;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #14140f;
        color: #fff;
        font-family: sans-serif;
        z-index: 10;
      }
      #loading-bar {
        width: 60%;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin-top: 12px;
        overflow: hidden;
      }
      #loading-bar > div {
        height: 100%;
        width: 0%;
        background: #fff;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div>Loading…</div>
      <div id="loading-bar"><div></div></div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
